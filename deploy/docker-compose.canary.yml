services:
  api-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QIYU_PERSISTENCE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qiyu}
      PORT: '3000'
      HOST: 0.0.0.0
      QIYU_TRIAL_AUTH: ${QIYU_TRIAL_AUTH:-invite}
      QIYU_LLM_PROVIDER: ${QIYU_LLM_PROVIDER:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ['3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ['canary']
