# 栖语封测环境编排：API + 独立 Worker + PostgreSQL(pgvector) + 一次性迁移服务。
# 用法见 deploy/README.md；环境变量放 deploy/.env（不入库）。
name: qiyu

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qiyu-beta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qiyu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - qiyu_postgres_data:/var/lib/postgresql/data
      # 首次初始化自动应用全部迁移；后续版本由 migrate 服务补齐缺失迁移。
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../infra/postgres/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # 数据库不直接对外：封测期只经 API 容器访问。排障时用
    # docker compose exec postgres psql ... 或临时加端口映射。
    expose:
      - "5432"
    # 2GiB 小机贴线部署：容器内存上限防 OOM 连坐（需配合宿主 swap，见 README）。
    mem_limit: 768m

  migrate:
    image: pgvector/pgvector:pg16
    container_name: qiyu-beta-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-qiyu}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - ../infra/postgres/migrations:/migrations:ro
      - ../infra/postgres/scripts/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/bin/sh", "/run-migrations.sh"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: qiyu-beta-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      QIYU_PERSISTENCE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qiyu}
      PORT: "3000"
      HOST: "0.0.0.0"
      # 可选能力：留空即关闭。接入时在 deploy/.env 提供真实值。
      QIYU_LLM_PROVIDER: ${QIYU_LLM_PROVIDER:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      # 仅评测脚本的成本口径；按模型地域/计费变更时由 .env 显式更新，运行时不据此扣费。
      QIYU_EVAL_PRICE_IN_PER_1M: ${QIYU_EVAL_PRICE_IN_PER_1M:-}
      QIYU_EVAL_PRICE_OUT_PER_1M: ${QIYU_EVAL_PRICE_OUT_PER_1M:-}
      # 封闭试用登录由 API 进程执行；Worker 不参与认证。
      QIYU_TRIAL_AUTH: ${QIYU_TRIAL_AUTH:-}
      QIYU_SMS_PROVIDER: ${QIYU_SMS_PROVIDER:-}
      QIYU_SMS_SDK_APP_ID: ${QIYU_SMS_SDK_APP_ID:-}
      QIYU_SMS_SIGN_NAME: ${QIYU_SMS_SIGN_NAME:-}
      QIYU_SMS_TEMPLATE_ID: ${QIYU_SMS_TEMPLATE_ID:-}
      QIYU_TEXT_MODERATION_PROVIDER: ${QIYU_TEXT_MODERATION_PROVIDER:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_REGION: ${TENCENT_REGION:-ap-guangzhou}
      TENCENT_TEXT_MODERATION_BIZ_TYPE: ${TENCENT_TEXT_MODERATION_BIZ_TYPE:-}
      QIYU_TTS_PROVIDER: ${QIYU_TTS_PROVIDER:-}
      QIYU_PRIVATE_MEDIA_STORE: ${QIYU_PRIVATE_MEDIA_STORE:-}
      TENCENT_TTS_VOICE_TYPE: ${TENCENT_TTS_VOICE_TYPE:-}
      TENCENT_TTS_VOICE_VERSION: ${TENCENT_TTS_VOICE_VERSION:-}
      TENCENT_TTS_AUTHORIZATION_RECORD_ID: ${TENCENT_TTS_AUTHORIZATION_RECORD_ID:-}
      TENCENT_TTS_RIGHTS_REVIEW_ID: ${TENCENT_TTS_RIGHTS_REVIEW_ID:-}
      TENCENT_TTS_MODEL_TYPE: ${TENCENT_TTS_MODEL_TYPE:-}
      TENCENT_TTS_SAMPLE_RATE: ${TENCENT_TTS_SAMPLE_RATE:-}
      TENCENT_TTS_API_MODE: ${TENCENT_TTS_API_MODE:-}
      TENCENT_TTS_APP_ID: ${TENCENT_TTS_APP_ID:-}
      TENCENT_TTS_TIMEOUT_MS: ${TENCENT_TTS_TIMEOUT_MS:-}
      QIYU_ASR_PROVIDER: ${QIYU_ASR_PROVIDER:-}
      TENCENT_ASR_ENGINE_MODEL_TYPE: ${TENCENT_ASR_ENGINE_MODEL_TYPE:-}
      QIYU_IMAGE_PROVIDER: ${QIYU_IMAGE_PROVIDER:-}
      QIYU_IMAGE_MODERATION_PROVIDER: ${QIYU_IMAGE_MODERATION_PROVIDER:-}
      TENCENT_HUNYUAN_REGION: ${TENCENT_HUNYUAN_REGION:-ap-guangzhou}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_ENDPOINT: ${TENCENT_COS_ENDPOINT:-}
      TENCENT_IMAGE_MODERATION_BIZ_TYPE: ${TENCENT_IMAGE_MODERATION_BIZ_TYPE:-}
      TENCENT_IMAGE_MODERATION_URL_EXPIRES_SECONDS: ${TENCENT_IMAGE_MODERATION_URL_EXPIRES_SECONDS:-120}
      QIYU_REVIEWER_TOKENS: ${QIYU_REVIEWER_TOKENS:-}
      # 仅作估算与告警。正式结算必须导入供应商账单并执行对账脚本。
      QIYU_COST_RATE_CARD_JSON: ${QIYU_COST_RATE_CARD_JSON:-}
      QIYU_ALERT_P99_LATENCY_MS: ${QIYU_ALERT_P99_LATENCY_MS:-15000}
      QIYU_ALERT_FAILURE_RATE: ${QIYU_ALERT_FAILURE_RATE:-0.05}
      QIYU_ALERT_UNIT_COST_FEN: ${QIYU_ALERT_UNIT_COST_FEN:-}
    ports:
      # 与同机其他服务（如既有 AI 质检系统）错开端口：左侧宿主端口在 .env 可调。
      - "${API_PORT:-3000}:3000"
    # Docker Desktop 的嵌入式 DNS 上游偶发不可用时，外部模型与媒体供应商
    # 会全部表现为网络失败；显式使用国内公共 DNS，容器内部服务发现仍由 Docker 处理。
    dns:
      - 119.29.29.29
      - 223.5.5.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: qiyu-beta-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "scripts/run-workers.js", "--interval-ms=5000"]
    environment:
      QIYU_PERSISTENCE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qiyu}
      # Worker 的摘要任务需要模型；未配置时仅消费 Embedding 队列（确定性，无外呼）。
      QIYU_LLM_PROVIDER: ${QIYU_LLM_PROVIDER:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      # 图片任务后台推进（P0 后台任务化）：与 API 同一批供应商变量，
      # 未配置时跳过图片队列，前端手动刷新仍是兜底。
      QIYU_IMAGE_PROVIDER: ${QIYU_IMAGE_PROVIDER:-}
      QIYU_IMAGE_MODERATION_PROVIDER: ${QIYU_IMAGE_MODERATION_PROVIDER:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_REGION: ${TENCENT_REGION:-ap-guangzhou}
      TENCENT_HUNYUAN_REGION: ${TENCENT_HUNYUAN_REGION:-ap-guangzhou}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_ENDPOINT: ${TENCENT_COS_ENDPOINT:-}
      TENCENT_IMAGE_MODERATION_BIZ_TYPE: ${TENCENT_IMAGE_MODERATION_BIZ_TYPE:-}
      TENCENT_IMAGE_MODERATION_URL_EXPIRES_SECONDS: ${TENCENT_IMAGE_MODERATION_URL_EXPIRES_SECONDS:-120}
      # 可选：内容权利清理专用角色连接串（NOLOGIN 角色须由 DBA 先建登录），
      # 留空则该队列继续由人工按 CONTENT_RIGHTS_REVIEWER_DEPLOYMENT.md 执行。
      QIYU_CONTENT_RIGHTS_CLEANUP_DATABASE_URL: ${QIYU_CONTENT_RIGHTS_CLEANUP_DATABASE_URL:-}
    dns:
      - 119.29.29.29
      - 223.5.5.5
    # Worker 不对外暴露任何端口。
    mem_limit: 384m

volumes:
  qiyu_postgres_data:
