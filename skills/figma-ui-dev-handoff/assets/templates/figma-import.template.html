<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figma 导入版模板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ece9e4; color: #2b272b; font-family: system-ui, sans-serif; }
    .board { display: flex; align-items: flex-start; gap: 64px; padding: 64px; }
    .figma-frame { width: 393px; height: 852px; flex: 0 0 393px; overflow: hidden; background: #fbf8f2; }
    .screen { min-height: 100%; padding: 59px 24px 34px; }
    .figma-component { padding: 16px; border: 1px solid #d8d0d8; border-radius: 16px; }
    .button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="board">
    <section id="Screen--notice-default" class="figma-frame" data-screen-id="notice-default" data-screen-name-zh="告知｜未确认" data-figma-name="告知｜未确认" aria-label="告知｜未确认" data-group-id="onboarding" data-group-name-zh="年龄与 AI 告知" data-viewport="393x852">
      <div class="screen">
        <div id="Component--system-notice-default" class="figma-component" data-component-id="system-notice-default" data-component-name-zh="系统告知｜默认" data-figma-name="系统告知｜默认" aria-label="系统告知｜默认">
          <h1>开始前，请先阅读告知</h1>
          <p>这里替换为产品的真实告知内容。</p>
        </div>
        <button id="Component--primary-button-disabled" class="figma-component button" data-component-id="primary-button-disabled" data-component-name-zh="按钮｜主按钮｜禁用" data-figma-name="按钮｜主按钮｜禁用" aria-label="按钮｜主按钮｜禁用" disabled>继续</button>
      </div>
    </section>
    <section id="Screen--age-pass" class="figma-frame" data-screen-id="age-pass" data-screen-name-zh="年龄｜PASS" data-figma-name="年龄｜PASS" aria-label="年龄｜PASS" data-group-id="age-assurance" data-group-name-zh="年龄增强核验" data-viewport="393x852">
      <div class="screen">
        <div id="Component--age-result-pass" class="figma-component" data-component-id="age-result-pass" data-component-name-zh="年龄结果｜通过" data-figma-name="年龄结果｜通过" aria-label="年龄结果｜通过">
          <h1>年龄核验已通过</h1>
          <p>这里替换为产品的真实结果说明。</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
