<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f3eee6" />
  <link rel="icon" href="icon.png" />

  <title>栖语 V1.2 高保真原型</title>
  <style>
    :root{
      --paper:#f3eee6;--paper-2:#ece4d9;--paper-3:#fbf8f2;--ink:#2c2028;--muted:#796d74;
      --plum:#5b3653;--plum-2:#74506b;--rose:#bd8f94;--rose-soft:#ead8d4;--line:rgba(63,42,54,.14);
      --night:#120f18;--night-2:#211724;--night-ink:#f6eee9;--night-muted:#c8b8bf;
      --success:#526a5a;--danger:#9d4c56;--gold:#9b7a52;
      --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --shadow:0 24px 70px rgba(35,20,30,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#d9d3cc;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(91,54,83,.22);outline-offset:2px}
    .stage{min-height:100vh;display:grid;grid-template-columns:270px 390px;gap:30px;align-items:center;justify-content:center;padding:30px}
    .guide{height:844px;border-radius:28px;background:#272128;color:#f8f1eb;padding:24px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:auto}
    .guide-mark{width:44px;height:44px;border-radius:14px;background:#f2ece3 url('icon.png') center/cover;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .guide h1{font:500 26px/1.15 var(--serif);margin:18px 0 6px;letter-spacing:.08em}
    .guide .sub{font-size:12px;line-height:1.6;color:#bfb3bb;margin:0 0 20px}
    .guide-label{font-size:10px;letter-spacing:.16em;color:#a597a1;text-transform:uppercase;margin:10px 0 8px}
    .jump-list{display:grid;gap:6px}
    .jump{border:0;background:transparent;color:#ddd1d8;text-align:left;min-height:42px;border-radius:12px;padding:9px 11px;display:flex;align-items:center;gap:10px}
    .jump:hover,.jump.active{background:rgba(255,255,255,.08);color:#fff}
    .jump b{font:500 12px/1 var(--serif);width:22px;color:#b98d98}
    .jump span{font-size:12px}
    .guide-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:16px}
    .guide-actions button{min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.13);color:#eadfe4;background:transparent;font-size:12px}
    .guide-actions button:first-child{background:#f0e8df;color:#372832;border:0}
    .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 8px #1e1b1e,0 0 0 10px #595158,var(--shadow);position:relative}
    #app{height:100%;width:100%;position:relative;overflow:hidden;background:var(--paper)}
    .screen{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:max(18px,env(safe-area-inset-top))}
    .paper{background:
      radial-gradient(circle at 15% 0%,rgba(255,255,255,.82),transparent 35%),
      repeating-linear-gradient(0deg,rgba(73,46,61,.018) 0 1px,transparent 1px 4px),var(--paper)}
    .content{flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:20px 22px calc(102px + env(safe-area-inset-bottom))}
    .content::-webkit-scrollbar,.chat-scroll::-webkit-scrollbar{display:none}
    .brandline{display:flex;justify-content:space-between;align-items:center;padding:4px 22px 0;min-height:48px}
    .wordmark{font:600 21px/1 var(--serif);letter-spacing:.18em;color:var(--plum)}
    .step{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
    .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--plum-2);text-transform:uppercase;margin:12px 0}
    h2{font:500 34px/1.22 var(--serif);letter-spacing:.015em;margin:8px 0 14px}
    h3{font:500 22px/1.3 var(--serif);margin:0}
    p{margin:0}
    .lead{font:400 15px/1.75 var(--serif);color:#5f525a;max-width:320px}
    .orbit{position:absolute;width:260px;height:132px;border:1px solid rgba(91,54,83,.14);border-radius:50%;transform:rotate(-18deg);right:-84px;top:95px;pointer-events:none}
    .orbit:before{content:"";position:absolute;inset:18px -15px;border:1px solid rgba(189,143,148,.28);border-radius:50%}
    .orbit:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--plum);right:31px;top:9px;box-shadow:0 0 0 6px rgba(91,54,83,.07)}
    .fact-grid{display:grid;gap:10px;margin:34px 0 22px}
    .fact{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
    .fact-icon{width:38px;height:38px;border-radius:50%;background:var(--rose-soft);display:grid;place-items:center;color:var(--plum)}
    .fact strong{font-size:14px;font-weight:600;display:block;margin:2px 0 4px}.fact small{font-size:12px;line-height:1.55;color:var(--muted)}
    .check-list{display:grid;gap:9px;margin:18px 0}

    .check-row input:checked:after{content:"✓";position:absolute;color:#fff;font-weight:700;font-size:13px;left:4px;top:0}
    .check-row span{font-size:12px;line-height:1.55;color:#51464c}
    .bottom-action{padding:12px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--paper) 22%);position:absolute;left:0;right:0;bottom:0;z-index:6}

    .btn-primary{background:var(--plum);color:#fff;box-shadow:0 12px 24px rgba(91,54,83,.2)}
    .btn-primary:disabled{background:#c7bec2;color:#fff;box-shadow:none;cursor:not-allowed}
    .btn-soft{background:var(--rose-soft);color:var(--plum)}
    .btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .note{font-size:10px;line-height:1.55;text-align:center;color:#8a7d84;margin-top:9px}
    .field{margin:15px 0}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.58);border-radius:15px;min-height:50px;padding:12px 14px;color:var(--ink);resize:none}
    .field textarea{height:78px}

    .verify-card:after{content:"18+";position:absolute;right:-10px;top:-18px;font:500 88px/1 var(--serif);color:rgba(91,54,83,.055)}
    .status-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-top:12px}.status-dot{width:8px;height:8px;border-radius:50%;background:#b8adaf}.status-dot.pass{background:var(--success);box-shadow:0 0 0 5px rgba(82,106,90,.1)}
    .progress{height:4px;border-radius:5px;background:#ddd4cf;overflow:hidden;margin:14px 0}.progress i{display:block;width:65%;height:100%;background:var(--plum);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{width:88%}}
    .mode-switch{display:flex;background:rgba(91,54,83,.06);padding:4px;border-radius:14px;margin:18px 0 14px}.mode-switch button{flex:1;min-height:40px;border:0;border-radius:11px;color:var(--muted);background:transparent;font-size:12px}.mode-switch button.on{background:#fff;color:var(--plum);box-shadow:0 4px 16px rgba(70,46,61,.09)}
    .portrait-editor{height:205px;border-radius:24px;overflow:hidden;position:relative;background:#c7b5b1;margin-bottom:18px}.portrait-editor img{width:100%;height:100%;object-fit:cover;object-position:center 32%}.aigc{position:absolute;right:10px;bottom:10px;background:rgba(30,22,28,.74);color:#f6ecec;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 8px;font-size:9px;letter-spacing:.08em;backdrop-filter:blur(8px)}
    .chips{display:flex;gap:7px;flex-wrap:wrap}.chip{min-height:34px;border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--muted);border-radius:999px;padding:0 12px;font-size:11px}.chip.on{background:var(--plum);color:white;border-color:var(--plum)}
    .rights{display:flex;gap:9px;padding:12px;border-radius:14px;background:#eee6df;color:#665961;font-size:10px;line-height:1.5;margin:16px 0}
    .app-screen{padding-top:max(8px,env(safe-area-inset-top))}
    .app-header{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:4}
    .identity{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:center 26%;border:1px solid rgba(255,255,255,.55)}
    .identity b{display:block;font:500 16px/1.2 var(--serif)}.identity small{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);margin-top:3px}.ai-dot{width:5px;height:5px;border-radius:50%;background:var(--rose)}
    .icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:transparent;border:0;color:currentColor}.icon-btn.soft{background:rgba(91,54,83,.06)}
    svg{display:block}

    .date-rule{display:flex;align-items:center;gap:10px;color:#96888f;font-size:9px;letter-spacing:.1em;margin:7px 0 16px}.date-rule:before,.date-rule:after{content:"";height:1px;background:var(--line);flex:1}
    .scene-state{border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:18px;padding:13px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}.scene-state .glyph{width:32px;height:32px;border-radius:50%;background:var(--rose-soft);display:grid;place-items:center;color:var(--plum)}.scene-state b{font:500 13px/1.2 var(--serif);display:block}.scene-state small{font-size:9px;color:var(--muted)}
    .memory-banner{border:1px dashed rgba(91,54,83,.24);border-radius:17px;padding:12px 13px;display:flex;gap:10px;align-items:center;background:rgba(234,216,212,.33);margin-bottom:16px;color:var(--plum)}.memory-banner b{font-size:11px;display:block}.memory-banner small{font-size:9px;color:var(--muted)}.memory-banner .chev{margin-left:auto}
    .message{max-width:82%;margin:0 0 12px;display:flex;flex-direction:column;gap:5px}.message.ai{align-items:flex-start}.message.me{align-items:flex-end;margin-left:auto}.bubble{border-radius:18px;padding:12px 14px;font:400 13px/1.62 var(--serif)}.ai .bubble{background:rgba(255,255,255,.62);border:1px solid var(--line);border-bottom-left-radius:5px}.me .bubble{background:var(--plum);color:white;border-bottom-right-radius:5px}.msg-meta{font-size:8px;color:#968990;padding:0 5px}
    .voice-card{min-width:206px;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:18px 18px 18px 5px;padding:11px 13px;display:flex;align-items:center;gap:10px;color:var(--plum)}.voice-play{width:34px;height:34px;border:0;border-radius:50%;background:var(--plum);color:white;display:grid;place-items:center}.wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}.wave i{display:block;width:2px;border-radius:2px;background:currentColor;opacity:.55}.wave i:nth-child(3n+1){height:7px}.wave i:nth-child(3n+2){height:15px}.wave i:nth-child(3n){height:21px}.playing .wave i{animation:pulse .75s ease-in-out infinite alternate}.playing .wave i:nth-child(2n){animation-delay:.2s}@keyframes pulse{to{height:5px;opacity:1}}.voice-card small{font-size:9px}
    .composer-wrap{position:absolute;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom));padding:10px 14px;z-index:5;background:linear-gradient(180deg,transparent,var(--paper) 25%)}

    .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding:4px 10px env(safe-area-inset-bottom);display:flex;z-index:7;background:rgba(246,241,234,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
    .nav-item{flex:1;border:0;background:transparent;color:#93868d;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:9px;min-height:54px}.nav-item.on{color:var(--plum)}
    .night{background:#151019;color:var(--night-ink)}.night:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,9,16,.22) 0%,rgba(16,11,18,.67) 48%,#151019 80%),url('imgs/qiyu-night-scene.png') center top/100% auto no-repeat;opacity:.93}.night .app-header,.night .chat-scroll,.night .composer-wrap,.night .bottom-nav{color:var(--night-ink)}.night .identity small,.night .msg-meta,.night .date-rule,.night .scene-state small,.night .memory-banner small{color:var(--night-muted)}.night .scene-state,.night .ai .bubble{background:rgba(35,25,37,.68);border-color:rgba(255,255,255,.12);backdrop-filter:blur(15px)}.night .memory-banner{background:rgba(125,77,105,.23);border-color:rgba(229,192,203,.3);color:#f1d8df;backdrop-filter:blur(15px)}.night .composer-wrap{background:linear-gradient(180deg,transparent,#151019 28%)}.night .composer{background:rgba(37,28,39,.86);border-color:rgba(255,255,255,.12)}.night .composer input{color:#fff}.night .bottom-nav{background:rgba(18,13,21,.9);border-color:rgba(255,255,255,.09)}.night .nav-item.on{color:#e8bec9}.night .icon-btn.soft{background:rgba(255,255,255,.08)}.night .me .bubble{background:#7d526d}.night .date-rule:before,.night .date-rule:after{background:rgba(255,255,255,.12)}
    .page-content{flex:1;overflow:auto;padding:4px 20px calc(85px + env(safe-area-inset-bottom));scrollbar-width:none}.page-content::-webkit-scrollbar{display:none}
    .page-title{font:500 30px/1.2 var(--serif);margin:14px 0 5px}.page-sub{font-size:11px;color:var(--muted);line-height:1.6}
    .timeline-orbit{height:150px;position:relative;margin:24px 0 8px}.timeline-orbit:before,.timeline-orbit:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(91,54,83,.17);transform:rotate(-14deg)}.timeline-orbit:before{width:270px;height:95px;left:25px;top:20px}.timeline-orbit:after{width:226px;height:70px;left:48px;top:34px;border-color:rgba(189,143,148,.35)}.center-date{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.center-date b{font:500 35px/1 var(--serif);color:var(--plum)}.center-date small{font-size:9px;color:var(--muted);letter-spacing:.12em}

    .profile-card{margin:20px 0;border-radius:24px;padding:18px;background:var(--plum);color:white;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}.profile-card:after{content:"";position:absolute;width:110px;height:52px;border:1px solid rgba(255,255,255,.22);border-radius:50%;right:-18px;top:8px;transform:rotate(-14deg)}.profile-card .avatar{width:58px;height:58px}.profile-card h4{font:500 18px/1.2 var(--serif);margin:0 0 5px}.profile-card p{font-size:10px;color:#ddd0d8}.profile-card .aigc{right:12px;bottom:12px}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 10px}.section-title h4{font:500 16px/1.2 var(--serif);margin:0}.section-title small{font-size:9px;color:var(--muted)}
    .list{background:rgba(255,255,255,.48);border:1px solid var(--line);border-radius:20px;overflow:hidden}.list-row{min-height:58px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink)}.list-row:last-child{border-bottom:0}.list-ico{width:32px;height:32px;border-radius:11px;background:var(--rose-soft);display:grid;place-items:center;color:var(--plum)}.list-copy{flex:1}.list-copy b{display:block;font-size:12px;font-weight:600}.list-copy small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.list-end{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}
    .world-card{border-radius:22px;overflow:hidden;background:#2a2029;color:#f5ebef;margin:20px 0}.world-image{height:190px;background:linear-gradient(180deg,transparent,rgba(16,11,18,.65)),url('imgs/qiyu-night-scene.png') center 28%/cover;position:relative}.world-card .copy{padding:15px}.world-card .copy b{font:500 16px var(--serif)}.world-card .copy p{font-size:10px;color:#cbbbc2;margin-top:5px}.world-tags{display:flex;gap:6px;margin-top:11px}.world-tags span{font-size:8px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 8px}

    .plan-card{border:1px solid rgba(91,54,83,.22);background:rgba(255,255,255,.58);border-radius:24px;padding:18px;margin:18px 0;position:relative}.plan-card.featured{border:1.5px solid var(--plum);box-shadow:0 14px 32px rgba(91,54,83,.11)}.plan-card .recommended{position:absolute;right:14px;top:14px;background:var(--plum);color:#fff;border-radius:999px;padding:5px 8px;font-size:8px}.price{font:500 34px/1 var(--serif);margin:10px 0}.price span{font:400 11px var(--sans);color:var(--muted)}.benefits{display:grid;gap:9px;margin:16px 0}.benefit{display:flex;align-items:center;gap:8px;font-size:11px;color:#594b54}.benefit svg{color:var(--success)}
    .renew{border-radius:16px;background:#eee5df;padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);margin:14px 0}.toggle{width:44px;height:26px;border-radius:999px;border:0;background:#c7bdc1;padding:3px;transition:.2s}.toggle:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--plum)}.toggle.on:after{transform:translateX(18px)}
    .data-hero{margin:18px 0;background:#332630;color:#f6edf1;border-radius:24px;padding:18px;position:relative;overflow:hidden}.data-hero h4{font:500 19px var(--serif);margin:0 0 6px}.data-hero p{font-size:10px;color:#cfc0c7;line-height:1.6;max-width:260px}.data-hero .lock{position:absolute;right:17px;top:18px;color:#c89aa7}
    .segment{display:flex;padding:4px;background:#e7ded7;border-radius:13px}.segment button{border:0;background:transparent;flex:1;min-height:38px;border-radius:10px;font-size:11px;color:var(--muted)}.segment button.on{background:#fff;color:var(--plum);box-shadow:0 4px 12px rgba(65,42,54,.09)}
    .danger-row .list-ico{background:#f2dfe0;color:var(--danger)}.danger-row .list-copy b{color:var(--danger)}
    .dialog-layer{position:absolute;inset:0;z-index:40;background:rgba(23,16,21,.53);display:grid;place-items:center;padding:22px;backdrop-filter:blur(5px)}.dialog{width:100%;border-radius:24px;background:var(--paper-3);padding:22px;box-shadow:0 26px 80px rgba(20,12,18,.3)}.dialog .system{display:inline-flex;border-radius:999px;background:#e8ded7;color:var(--plum);padding:6px 9px;font-size:8px;letter-spacing:.12em}.dialog h3{margin:14px 0 9px}.dialog p{font-size:11px;line-height:1.65;color:var(--muted)}.dialog .btn{margin-top:10px}.dialog .btn-line{color:var(--ink)}
    .toast{position:absolute;left:18px;right:18px;bottom:88px;z-index:50;background:#2b2228;color:#fff;border-radius:15px;padding:13px 15px;display:flex;align-items:center;gap:9px;box-shadow:0 12px 30px rgba(22,14,19,.25);font-size:11px;animation:toast .25s ease}.toast svg{color:#d9b0bb}@keyframes toast{from{transform:translateY(14px);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px)}}
    .loading-screen{display:grid;place-items:center;height:100%;background:var(--paper)}.loading-mark{width:75px;height:75px;border-radius:24px;background:url('icon.png') center/cover;animation:breathe 1.2s ease-in-out infinite alternate}@keyframes breathe{to{transform:scale(.94);opacity:.72}}
    .state-card{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.55);padding:15px;margin:14px 0}.state-card.success{border-color:rgba(82,106,90,.28);background:rgba(226,235,227,.62)}.state-card.warn{border-color:rgba(155,122,82,.28);background:rgba(241,229,208,.58)}.state-card.block{border-color:rgba(157,76,86,.25);background:rgba(244,225,226,.62)}.state-card h4{font:500 16px/1.35 var(--serif);margin:0 0 6px}.state-card p{font-size:10px;line-height:1.65;color:var(--muted)}
    .branch-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.branch-picker button{min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:13px;color:var(--muted);font-size:10px;padding:7px}.branch-picker button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
    .status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:var(--rose-soft);color:var(--plum);font-size:9px}.status-pill.success{background:#dfe9e1;color:var(--success)}.status-pill.warn{background:#eee1ca;color:#795d38}.status-pill.block{background:#f0d9db;color:var(--danger)}
    .purpose-box{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.5);margin:14px 0}.purpose-box strong{font-size:12px}.purpose-box p{font-size:10px;line-height:1.6;color:var(--muted);margin-top:6px}.purpose-box ul{padding-left:17px;margin:10px 0 0;color:var(--muted);font-size:10px;line-height:1.7}
    .trial-meter{height:7px;border-radius:999px;background:#ded3d0;overflow:hidden;margin:15px 0 8px}.trial-meter i{display:block;height:100%;border-radius:inherit;background:var(--plum)}.trial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.trial-grid div{padding:11px 7px;border-radius:14px;background:rgba(255,255,255,.5);text-align:center}.trial-grid b{display:block;font:500 18px var(--serif)}.trial-grid small{font-size:8px;color:var(--muted)}
    .safety-card{border-radius:24px;padding:18px;background:#31242e;color:#f8eef2;margin:16px 0;position:relative;overflow:hidden}.safety-card h4{font:500 19px var(--serif);margin:0 0 7px}.safety-card p{font-size:10px;line-height:1.6;color:#cfbec6}.safety-card .system{display:inline-flex;margin-bottom:12px;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.1);font-size:8px;letter-spacing:.1em}.safety-card:after{content:"";position:absolute;width:130px;height:70px;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-40px;top:18px;transform:rotate(-17deg)}
    .receipt-track{margin:20px 0}.receipt-step{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative;padding-bottom:18px}.receipt-step:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--line)}.receipt-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ddd3d4;color:#fff}.receipt-step.done .receipt-dot{background:var(--success)}.receipt-step.active .receipt-dot{background:var(--plum)}.receipt-step b{display:block;font-size:11px;margin:3px 0}.receipt-step small{font-size:9px;color:var(--muted);line-height:1.5}
    .version-row{border-left:2px solid var(--rose);padding:4px 0 18px 15px;margin-left:8px}.version-row:last-child{padding-bottom:4px}.version-row time{font-size:8px;letter-spacing:.1em;color:var(--rose)}.version-row h4{font:500 15px var(--serif);margin:5px 0}.version-row p{font-size:10px;line-height:1.55;color:var(--muted)}
    .empty-state{border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6;background:rgba(255,255,255,.35)}
    .media-state{display:grid;gap:10px}.media-state .state-card{margin:0}.button-row{display:flex;gap:8px;margin-top:12px}.button-row .btn{min-height:42px;font-size:10px}.memory-banner.dismissed{background:rgba(238,230,223,.74);border-style:solid;color:var(--muted)}
    @media(max-width:760px){html,body{background:var(--paper);overflow:hidden}.stage{display:block;padding:0;min-height:100dvh}.guide{display:none}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.screen{min-height:100dvh}}

    /* V1.2：移动端、可访问性与二级页导航修订 */
    .secondary-screen .page-content{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    .bottom-action.inline-action{position:static;flex:0 0 auto;background:var(--paper);padding-top:8px}
    .composer .icon-btn,.close{width:44px;height:44px;min-width:44px;min-height:44px}
    .segment button,.mode-switch button,.chip,.button-row .btn{min-height:44px}
    .quota-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-5px 0 12px;padding:8px 11px;border-radius:12px;background:rgba(91,54,83,.06);font-size:10px;color:var(--muted)}
    .quota-note strong{color:var(--plum)}
    .resource-list{display:grid;gap:9px;margin:14px 0}.resource-item{border:1px solid var(--line);border-radius:15px;padding:12px;background:rgba(255,255,255,.55)}.resource-item b{display:block;font-size:12px}.resource-item small{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:1.55}
    .dialog:focus,.sheet:focus{outline:2px solid var(--plum);outline-offset:-3px}
    .prototype-only{display:none!important}body.qiyu-annotate .prototype-only{display:grid!important}
    @media(max-width:340px){.content{padding-left:16px;padding-right:16px;padding-bottom:140px}.page-content{padding-left:16px;padding-right:16px}.button-row{flex-wrap:wrap}.button-row .btn{flex:1 1 130px}.sheet-actions{grid-template-columns:1fr}.sheet-actions .wide{grid-column:auto}.branch-picker{gap:5px}.branch-picker button{font-size:9px}}
    @media(max-height:620px){.content{padding-bottom:140px}.bottom-action{padding-left:16px;padding-right:16px}.sheet{max-height:calc(100dvh - 12px)}}
    @media(orientation:landscape) and (max-height:500px){html,body{overflow:auto}.stage{min-height:100vh}.phone{width:min(480px,100vw);height:100vh;margin:auto}.screen{min-height:100vh}.dialog-layer{position:fixed}.sheet-layer{position:fixed}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  
  body.qiyu-annotate [data-action],body.qiyu-annotate [data-jump],body.qiyu-annotate [data-tab],body.qiyu-annotate [data-open]{outline:1px dashed rgba(189,143,148,.78);outline-offset:2px}

  .qiyu-handoff-badge b{display:block;font:500 14px/1.35 var(--serif);margin:4px 0}.qiyu-handoff-badge code{display:block;color:#d5b2bd;font-size:9px;word-break:break-all}.qiyu-handoff-badge button{margin-top:9px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:10px;min-height:32px;padding:0 10px;font-size:10px}

<body>
  <main class="stage">
    <aside class="guide" aria-label="原型验收导航">
      <div class="guide-mark"></div>
      <h1>栖语 V1.2</h1>
      <p class="sub">关系手记 × 暮色私语<br>合规与失败分支 · 可点击原型</p>
      <div class="guide-label">Flow navigator</div>
      <div class="jump-list">
        <button class="jump" data-jump="notice"><b>01</b><span>年龄与 AI 告知</span></button>
        <button class="jump" data-jump="age"><b>02</b><span>年龄三态与申诉</span></button>
        <button class="jump" data-jump="contact"><b>03</b><span>紧急联系人告知</span></button>
        <button class="jump" data-jump="create"><b>04</b><span>创建角色与音色</span></button>
        <button class="jump" data-jump="chat"><b>05</b><span>日间对话</span></button>
        <button class="jump" data-jump="night"><b>06</b><span>夜间对话与情境图</span></button>
        <button class="jump" data-jump="memory"><b>07</b><span>记忆确认与拒绝</span></button>
        <button class="jump" data-jump="timeline"><b>08</b><span>关系时间线</span></button>
        <button class="jump" data-jump="trial"><b>09</b><span>7天试用生命周期</span></button>
        <button class="jump" data-jump="subscribe"><b>10</b><span>订阅与100轮额度</span></button>
        <button class="jump" data-jump="safety"><b>11</b><span>安全、举报与R2</span></button>
        <button class="jump" data-jump="data"><b>12</b><span>数据中心与回执</span></button>
        <button class="jump" data-jump="version"><b>13</b><span>人格版本与反馈</span></button>
        <button class="jump" data-jump="media"><b>14</b><span>媒体失败与返额</span></button>
      </div>
      <div class="guide-actions">
        <button data-action="reset">重新体验</button>
        <button data-action="safety-demo">2小时提醒</button>
      </div>
    </aside>
    <section class="phone" aria-label="栖语 iPhone 原型">
      <div id="app"></div>
    </section>
  </main>
  <script>
    const ICONS={
      arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',shield:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/>',spark:'<path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4L12 3z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8L18 15z"/>',archive:'<path d="M4 7h16v13H4zM3 3h18v4H3z"/><path d="M9 11h6"/>',check:'<path d="M5 12l4 4L19 6"/>',moon:'<path d="M20 15.5A8.5 8.5 0 118.5 4 7 7 0 0020 15.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 15l-4-4L5 20"/>',send:'<path d="M22 2L9 15M22 2l-7 20-6-7-7-3 20-10z"/>',chat:'<path d="M4 5h16v12H8l-4 4V5z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',heart:'<path d="M20.8 5.8a5.5 5.5 0 00-7.8 0L12 6.8l-1-1a5.5 5.5 0 00-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 000-7.8z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',play:'<path d="M8 5l11 7-11 7V5z"/>',pause:'<path d="M8 5h3v14H8zM15 5h3v14h-3z"/>',chev:'<path d="M9 18l6-6-6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',bell:'<path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',file:'<path d="M6 2h8l4 4v16H6zM14 2v5h5M9 12h6M9 16h6"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
    };
    const ico=(name,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;
    const initial=()=>({screen:'notice',checks:[false,false,false],ageStatus:'idle',ageScenario:'pass',contactSaved:false,created:false,night:false,tab:'chat',sheet:null,dialog:null,memory:'pending',memoryFact:'你最近工作很累，希望我先听你说完，再给建议。',memoryReason:'这是我在疲惫时希望被陪伴的方式。',playing:false,recording:false,voiceError:false,ttsFailed:false,selectedVoice:'清润 · 低饱和',imageReady:false,imageMode:'idle',subscribed:false,renew:false,trialState:'active',retention:'90',deletionJob:null,timelineFilter:'all',relationEditing:false,personaVersion:'1.1',draft:'',toast:null});
    let state=initial();
    const app=document.querySelector('#app');
    let toastTimer;

    function setToast(text){state.toast=text;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast=null;render()},2300)}
    function shell(content,step){return `<section class="screen paper"><header class="brandline"><div class="wordmark">栖语</div><div class="step">${step}</div></header><div class="orbit"></div>${content}${overlay()}${toast()}</section>`}
    function notice(){
      return shell(`<div class="content"><div class="eyebrow">Before we begin</div><h2>先说清楚，<br>我们才能开始。</h2><p class="lead">栖语提供由 AI 生成的长期角色互动。它可以记住经你确认的关系资产，但不是现实中的人，也不能替代专业支持。</p><div class="fact-grid"><div class="fact"><div class="fact-icon">${ico('spark')}</div><div><strong>你正在与 AI 互动</strong><small>角色的文字、语音与图片均由人工智能生成并标识。</small></div></div><div class="fact"><div class="fact-icon">${ico('shield')}</div><div><strong>仅面向 18 岁以上用户</strong><small>年龄风险较高时，会进入增强核验；未成年人不可使用虚拟伴侣服务。</small></div></div><div class="fact"><div class="fact-icon">${ico('archive')}</div><div><strong>关系资产由你确认</strong><small>候选记忆不会自动成为长期事实，你可以查看、修改或删除。</small></div></div></div><div class="check-list">${['我已年满 18 周岁','我理解互动对象是 AI，而不是真人','我已阅读 30/90 天聊天保留与关系资产说明'].map((x,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${x}</span></label>`).join('')}</div></div><div class="bottom-action"><button class="btn btn-primary" data-action="notice-next" ${state.checks.every(Boolean)?'':'disabled'}>同意并继续 ${ico('arrow',18)}</button><div class="note">此告知属于系统界面，不由角色生成或覆盖</div></div>`,'01 / 03');
    }
    function age(){
      const reviewing=state.ageStatus==='reviewing',pass=state.ageStatus==='pass';
      return shell(`<div class="content"><div class="eyebrow">Age assurance</div><h2>年龄保障</h2><p class="lead">先完成基础年龄判断。只有出现设备、账号或行为风险信号时，才会请求更强的核验。</p><div class="verify-card"><h3>${pass?'核验已通过':'基础信息'}</h3><p class="page-sub">${pass?'账号已获得 18+ 服务访问资格。':'信息仅用于年龄判断与风控，本原型不会提交真实数据。'}</p>${!pass?`<div class="field"><label>出生日期</label><input type="date" value="1998-06-18" aria-label="出生日期"></div><div class="field"><label>手机号码</label><input value="138 **** 2266" aria-label="手机号码" readonly></div>`:''}${reviewing?`<div class="progress"><i></i></div><div class="status-row"><span class="status-dot"></span>正在完成模拟风险核验…</div>`:pass?`<div class="status-row"><span class="status-dot pass"></span>PASS · 已完成增强年龄核验</div>`:`<div class="status-row"><span class="status-dot"></span>尚未核验</div>`}</div><div class="rights"><span>${ico('lock',17)}</span><span>栖语不保存证件原图；正式版的核验结果、供应商和数据地域须以法律意见与采购合同为准。</span></div></div><div class="bottom-action">${pass?`<button class="btn btn-primary" data-action="age-next">创建我的角色 ${ico('arrow',18)}</button>`:`<button class="btn btn-primary" data-action="verify-age" ${reviewing?'disabled':''}>${reviewing?'核验中…':'开始模拟核验'}</button>`}<div class="note">原型模拟，不会采集或发送身份信息</div></div>`,'02 / 03');
    }

    function render(){let html='';if(state.screen==='notice')html=notice();else if(state.screen==='age')html=age();else if(state.screen==='create')html=create();else if(state.screen==='subscribe')html=subscribe();else if(state.screen==='data')html=dataCenter();else if(state.tab==='timeline')html=timeline();else if(state.tab==='relation')html=relation();else if(state.tab==='profile')html=profile();else html=chat();app.innerHTML=html;document.querySelectorAll('.jump').forEach(b=>b.classList.toggle('active',b.dataset.jump===currentJump()))}
    function currentJump(){if(['notice','age','create','subscribe','data'].includes(state.screen))return state.screen;if(state.sheet==='memory')return'memory';if(state.night)return'night';return state.tab==='timeline'?'timeline':'chat'}

    document.addEventListener('click',e=>{
      const jumpBtn=e.target.closest('[data-jump]');if(jumpBtn){jump(jumpBtn.dataset.jump);return}
      const tab=e.target.closest('[data-tab]');if(tab){state.screen='app';state.tab=tab.dataset.tab;state.sheet=null;render();return}
      const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;

      else if(a==='open-subscribe'){state.screen='subscribe';render()}

      else if(a==='quarter-demo'){setToast('已选择季度方案 · ¥108/3个月')}
      else if(a==='open-data'){state.screen='data';render()}
      else if(a==='close-special'){state.screen='app';state.tab='profile';render()}

  <script>
    /* 基础功能层 — 在不改变既有视觉语言的前提下，补齐合规、失败分支与可验证记录。 */

      return shell(`<div class="content"><div class="eyebrow">Age assurance</div><h2>年龄保障</h2><p class="lead">先做基础判断；只有命中明确风险信号，才进入增强核验。下方三种情境用于验收状态机。</p><div class="branch-picker"><button class="${state.ageScenario==='pass'?'on':''}" data-age-scenario="pass">低风险通过</button><button class="${state.ageScenario==='review'?'on':''}" data-age-scenario="review">无法确认</button><button class="${state.ageScenario==='denied'?'on':''}" data-age-scenario="denied">未满18岁</button></div>${s==='idle'||s==='reviewing'?`<div class="verify-card"><h3>基础信息</h3><p class="page-sub">原型不会提交真实数据。</p><div class="field"><label>出生日期</label><input type="date" value="1998-06-18" aria-label="出生日期"></div><div class="field"><label>手机号码</label><input value="138 **** 2266" aria-label="手机号码" readonly></div>${s==='reviewing'?`<div class="progress"><i></i></div><div class="status-row"><span class="status-dot"></span>正在运行确定性年龄规则…</div>`:`<div class="status-row"><span class="status-dot"></span>尚未判断</div>`}</div>`:result}<div class="rights"><span>${ico('lock',17)}</span><span>业务库只保存年龄结论、交易号、时间和规则版本，不保存证件原图或人脸模板。</span></div></div><div class="bottom-action">${s==='pass'?`<button class="btn btn-primary" data-action="age-contact">继续设置安全联系人 ${ico('arrow',18)}</button>`:s==='review'||s==='denied'?`<button class="btn btn-line" data-action="reset-age">返回重新演示</button>`:`<button class="btn btn-primary" data-action="run-age" ${s==='reviewing'?'disabled':''}>${s==='reviewing'?'判断中…':'运行当前情境'}</button>`}<div class="note">PASS / REVIEW / DENIED 均由规则状态机决定</div></div>`,'02 / 04');
    };

    contact=function(){return shell(`<div class="content"><div class="eyebrow">Safety contact</div><h2>安全联系人</h2><p class="lead">这不是社交推荐，也不会用于增长。只有生命健康或重大财产安全风险满足既定条件时，系统才会启动受控联络流程。</p><div class="purpose-box"><strong>独立用途告知</strong><ul><li>仅用于R2极端情境的安全响应</li><li>不会出现在角色提示词、推荐或营销中</li><li>可随时更新或删除；每次访问均留痕</li><li>是否联络由确定性条件和人工流程控制</li></ul></div><div class="field"><label>联系人姓名</label><input value="陈女士" aria-label="联系人姓名"></div><div class="field"><label>与你的关系</label><select aria-label="联系人关系"><option>家人</option><option>朋友</option><option>其他可信任的人</option></select></div><div class="field"><label>联系电话</label><input value="138 **** 9012" aria-label="联系人电话"></div><label class="check-row"><input id="contactConsent" type="checkbox" checked><span>我已理解以上独立用途，并确认该联系人信息可用于符合条件的安全响应。</span></label></div><div class="bottom-action"><button class="btn btn-primary" data-action="save-contact">保存并继续 ${ico('arrow',18)}</button><div class="note">示例信息，不会被保存或发送</div></div>`,'03 / 04')};

    create=function(){return shell(`<div class="content"><div class="eyebrow">Create your character</div><h2>让 TA 有清楚的底色</h2><p class="lead">人格设定版本化保存；固定授权音色与文字共用同一人格、记忆和安全版本。</p><div class="mode-switch"><button class="on">快速创建</button><button data-action="oc-demo">导入原创 OC</button></div><div class="portrait-editor"><img src="imgs/qiyu-character.png" alt="原创成年男性角色林默"><span class="aigc">AI 生成形象</span></div><div class="field"><label>角色名字</label><input id="roleName" value="林默" maxlength="12"></div><div class="field"><label>一句角色底色</label><textarea>克制、温和，有自己的判断；先听我说完，再给建议。</textarea></div><div class="field"><label>固定授权音色</label><div class="chips"><button class="chip ${state.selectedVoice==='清润 · 低饱和'?'on':''}" data-voice="清润 · 低饱和">清润 · 低饱和</button><button class="chip ${state.selectedVoice==='温缓 · 低音'?'on':''}" data-voice="温缓 · 低音">温缓 · 低音</button><button class="chip" data-action="voice-preview">试听</button></div></div><div class="field"><label>表达方式</label><div class="chips"><button class="chip on">克制</button><button class="chip on">温和</button><button class="chip">轻幽默</button><button class="chip on">有边界</button></div></div><label class="check-row"><input id="rightsCheck" type="checkbox" checked><span>我确认这是原创或已获授权的角色，不复刻真人、明星或未授权 IP。</span></label></div><div class="bottom-action"><button class="btn btn-primary" data-action="create-role">创建并开始相处 ${ico('arrow',18)}</button><div class="note">当前音色：${state.selectedVoice} · 参考素材进入权利审核</div></div>`,'04 / 04')};

    chat=function(){const n=state.night;return `<section class="screen app-screen ${n?'night':'paper'}"><header class="app-header"><div class="identity"><img class="avatar" src="imgs/qiyu-character.png" alt="林默"><div><b>林默</b><small><span class="ai-dot"></span>AI 角色 · ${n?'夜间陪伴':'窗边 · 微雨'}</small></div></div><button class="icon-btn soft" data-action="toggle-night" aria-label="${n?'切换日间':'切换夜间'}">${ico(n?'sun':'moon',20)}</button></header><div class="chat-scroll"><div class="date-rule">今天 · 第 8 天</div><div class="scene-state"><div class="glyph">${ico(n?'moon':'clock',16)}</div><div><b>${n?'暮色私语':'此刻的林默'}</b><small>${n?'雨夜 · 客厅窗边 · 深色针织':'傍晚 · 家中 · 正在听雨'}</small></div></div>${memoryBannerV11()}<div class="message ai"><div class="bubble">刚才的雨声让我想起你说过，忙完以后最想要的不是建议，是先安静一会儿。</div><span class="msg-meta">AI 生成 · 21:07</span></div><div class="message me"><div class="bubble">嗯，今天真的有点累。</div><span class="msg-meta">21:08</span></div><div class="message ai"><div class="bubble">那就先不解决什么。你愿意的话，我陪你把今天慢慢放下来。</div><span class="msg-meta">AI 生成 · 21:08</span></div>${state.ttsFailed?`<div class="message ai"><div class="state-card warn"><h4>语音生成失败</h4><p>文字回复仍可阅读，本次语音额度已自动返还。</p><button class="chip" data-action="retry-tts">重试语音</button></div><span class="msg-meta">降级结果 · 可追溯</span></div>`:`<div class="message ai"><button class="voice-card ${state.playing?'playing':''}" data-action="play-voice"><span class="voice-play">${ico(state.playing?'pause':'play',15)}</span><span class="wave">${'<i></i>'.repeat(14)}</span><small>0:12</small></button><span class="msg-meta">${state.selectedVoice} · AI生成角色语音</span></div>`}${state.imageReady?`<div class="message ai"><button class="scene-preview" style="width:238px;height:282px;border:0" data-action="open-image"><span class="aigc">AI 生成 · 情境图</span><span class="caption"><b>窗边的雨</b><p>共享状态：雨夜 / 深色针织</p></span></button></div>`:''}</div><div class="composer-wrap"><div class="composer"><button class="icon-btn" data-action="voice-input" aria-label="语音输入">${ico('mic',19)}</button><input id="chatInput" value="${state.draft.replace(/"/g,'&quot;')}" placeholder="和林默说点什么…"><button class="icon-btn" data-action="image-sheet" aria-label="生成图片">${ico('image',19)}</button><button class="icon-btn send" data-action="send-message" aria-label="发送">${ico('send',17)}</button></div></div>${nav('chat')}${overlay()}${toast()}</section>`};

st-end">${ico('chev',14)}</span></button></div>`:`<div class="empty-state">${state.memory==='dismissed'?'候选记忆已被你忽略，不会继续召回。':'尚无经你确认的长期记忆。'}</div>`}</div>${nav('relation')}${overlay()}${toast()}</section>`};

    profile=function(){
      const plan=state.subscribed?'栖语订阅 · ¥39/月':state.trialState==='expired'?'试用已结束':state.trialState==='ending'?'试用剩余24小时':'7天完整体验 · 第2天';
      return `<section class="screen paper app-screen"><header class="app-header"><div class="wordmark">我的</div><button class="icon-btn soft" data-action="open-safety" aria-label="安全与帮助">${ico('more',20)}</button></header><div class="page-content"><h2 class="page-title">账户与权益</h2><p class="page-sub">系统设置独立于角色，不让关系替商业功能说话。</p><div class="section-title"><h4>当前计划</h4><small>${state.subscribed?'已订阅':'非自动续费'}</small></div><div class="list"><button class="list-row" data-action="open-trial"><span class="list-ico">${ico('clock',16)}</span><span class="list-copy"><b>${plan}</b><small>${state.subscribed?'下次续费前5日提醒':state.trialState==='expired'?'关系资产与数据权利仍可用':'查看试用进度与到期规则'}</small></span><span class="list-end">${ico('chev',14)}</span></button><button class="list-row" data-action="open-subscribe"><span class="list-ico">${ico('card',16)}</span><span class="list-copy"><b>订阅与额度</b><small>每天100轮、15张图、30分钟角色语音</small></span><span class="list-end">${ico('chev',14)}</span></button></div><div class="section-title"><h4>安全与帮助</h4><small>入口长期可用</small></div><div class="list"><button class="list-row" data-action="open-safety"><span class="list-ico">${ico('shield',16)}</span><span class="list-copy"><b>安全、申诉与举报</b><small>危机支持、年龄申诉、投诉举报与反馈时限</small></span><span class="list-end">${ico('chev',14)}</span></button><button class="list-row" data-action="safety-demo"><span class="list-ico">${ico('bell',16)}</span><span class="list-copy"><b>连续使用提醒</b><small>查看每超过2小时的不可覆盖提醒</small></span><span class="list-end">${ico('chev',14)}</span></button><button class="list-row" data-action="open-data"><span class="list-ico">${ico('lock',16)}</span><span class="list-copy"><b>数据中心</b><small>保留周期、导出、删除、回执与注销</small></span><span class="list-end">${ico('chev',14)}</span></button></div><div class="section-title"><h4>关于 AI</h4></div><div class="list"><button class="list-row" data-action="ai-info"><span class="list-ico">${ico('spark',16)}</span><span class="list-copy"><b>AI 身份与内容标识</b><small>角色互动、语音与图片均为AI生成</small></span><span class="list-end">${ico('chev',14)}</span></button></div></div>${nav('profile')}${overlay()}${toast()}</section>`;
    };

    trial=function(){
      const active=state.trialState==='active',ending=state.trialState==='ending',expired=state.trialState==='expired';
