<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖语运营台</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><small>DEVELOPMENT REVIEW CONSOLE</small><h1>栖语运营台</h1><p>审核与异常队列；不具备绕过领域状态机的权限。</p></div>
  <form id="login"><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><label>动态码（启用 MFA 的账号必填）<input id="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位"></label><button>登录</button></form>
  <form id="auth" hidden><label>审核员令牌（开发静态令牌兜底）<input id="token" type="password" autocomplete="off" required></label><button>连接并刷新</button></form>
  <div id="session" hidden><span id="who"></span> <button id="logout" type="button">注销会话</button> <button id="use-token" type="button">改用静态令牌</button></div>
</header>
<main><div id="status">未登录：用审核员账号登录（密码 + TOTP）；会话令牌仅存于当前页面内存。</div><nav id="tabs"></nav><section id="queue"></section></main>
<template id="empty"><div class="empty">当前队列为空</div></template><script src="/app.js" defer></script></body></html>
